[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samanvaya"
version = "0.2.0"
description = "An experimental constitutional kernel for governed agent collectives"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "HoloMathics LLC"}]
keywords = ["AI agents", "governance", "constitutional AI", "hypergraphs", "audit"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
langchain = ["langchain>=1.0,<2.0", "langchain-core>=1.0,<2.0"]

[project.scripts]
samanvaya = "samanvaya.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
